<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Path test 3 - steps 1-4</title>
<style>body{font:16px/1.6 system-ui,sans-serif;margin:12vh auto;max-width:34rem;padding:0 1.5rem}
h1{font-size:1.4rem}code{background:#eee;padding:.1em .35em;border-radius:3px}
a,button{display:inline-block;margin-top:1.5rem;font:inherit;padding:.7em 1.2em;border:1px solid #333;
border-radius:6px;background:#fff;color:#111;text-decoration:none;cursor:pointer}
.tag{display:inline-block;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;
background:#111;color:#fff;padding:.2em .5em;border-radius:3px;margin-bottom:.75rem}
.q{background:#b30000}
/* Watermark: the step number, tiled across the viewport and repeated in a
   corner badge, so a screenshot or a glance is enough to say which step you
   were on when something did or did not record. */
body{position:relative;z-index:1}
#wm{position:fixed;inset:-25%;z-index:0;pointer-events:none;user-select:none;
display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1.2rem 2.5rem;
transform:rotate(-22deg);opacity:.10;overflow:hidden}
#wm span{font:800 2.4rem/1 system-ui,sans-serif;white-space:nowrap;letter-spacing:.06em}
#badge{position:fixed;top:0;right:0;z-index:2;background:#111;color:#fff;
font:800 1.1rem/1 system-ui,sans-serif;letter-spacing:.08em;padding:.9rem 1.1rem;
border-bottom-left-radius:8px}</style>

<div id="wm"></div><div id="badge"></div>
<div id="body"></div>

<p style="margin-top:2rem;color:#777;font-size:.85rem">Diagnostic page. Not part of the study.</p>
<script>
var y = new URLSearchParams(location.search).get('y');
var el = document.getElementById('body');

/* Tile the step number across the viewport. Step number is 1-based off `y`:
   no param = step 1, y=1 = step 2, and so on. */
function watermark(n) {
  document.getElementById('badge').textContent = 'STEP ' + n;
  var wm = document.getElementById('wm'), out = '';
  for (var i = 0; i < 72; i++) out += '<span>STEP ' + n + '</span>';
  wm.innerHTML = out;
  document.title = 'Step ' + n + ' - path test 3';
}
watermark(y ? (parseInt(y, 10) + 1) : 1);

function delayedGo(href) {
  return function () { setTimeout(function () { location.assign(href); }, 300); };
}

if (!y) {
  el.innerHTML = '<span class="tag">expect: recorded</span>' +
    '<h1>Step 1 - link, query string only</h1>' +
    '<p>An ordinary link that adds <code>?y=1</code>. Same path. This recorded in round 1, ' +
    'so if it fails here the run itself is wrong and nothing below means anything.</p>' +
    '<a href="?y=1">Continue</a>';
} else if (y === '1') {
  el.innerHTML = '<span class="tag q">the question</span>' +
    '<h1>Step 2 - button, query string only</h1>' +
    '<p>A button that waits 300ms and then navigates to <code>?y=2</code>. Same path, ' +
    'code-driven. This is exactly what the prototypes do, and the one combination no ' +
    'earlier round tested.</p>' +
    '<button id="go">Continue</button>';
  document.getElementById('go').onclick = delayedGo('?y=2');
} else if (y === '2') {
  el.innerHTML = '<span class="tag q">the question</span>' +
    '<h1>Step 3 - content swaps first, then the URL changes</h1>' +
    '<p>The closest thing to what the prototypes actually do: clicking replaces what is on ' +
    'screen <em>immediately</em>, and only 300ms later does the URL change to ' +
    '<code>?y=3</code>. Earlier rounds all sat still until the navigation, so the instant ' +
    'redraw was never tested.</p>' +
    '<button id="go">Continue</button>';
  document.getElementById('go').onclick = function () {
    /* Same shape as an SPA screen change: the view is replaced in the click
       handler, the URL follows separately. */
    el.innerHTML = '<h1>Navigating...</h1><p>Content already swapped. URL changes shortly.</p>';
    setTimeout(function () { location.assign('?y=3'); }, 300);
  };
} else {
  el.innerHTML = '<span class="tag">expect: recorded</span>' +
    '<h1>Step 4 - button, new path</h1>' +
    '<p>The same button and the same 300ms delay, but to a different <strong>path</strong>. ' +
    'This is what round 2 tested and it recorded. If the two steps above failed and this ' +
    'one works, code-driven navigation needs a path change.</p>' +
    '<button id="go">Continue</button>';
  document.getElementById('go').onclick = delayedGo('step-b/');
}
</script>
